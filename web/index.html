<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavis</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070414; }
    canvas { display: block; width: 100%; height: 100%; }
    #caption {
      position: absolute;
      left: 16px;
      bottom: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(6, 4, 14, 0.78);
      color: #f3fbff;
      font: 600 11px/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0.92;
      transition: opacity 0.7s ease;
      box-shadow: 0 0 0 1px rgba(92, 239, 255, 0.28);
    }
    #caption.away { opacity: 0; }
  </style>
</head>
<body>
  <div id="caption">Waveform</div>
  <script src="app.js"></script>
</body>
</html>
